name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee -a build.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee -a build.log

      # Gradle buries compiler errors above a long stack trace. Repeating them last means the
      # actual problem is visible at the end of the log rather than hundreds of lines up.
      - name: Compiler errors
        if: failure()
        run: |
          echo "::group::Kotlin and Java errors"
          grep -E "^(e:|error:)" build.log || echo "(no compiler errors — likely a failing test)"
          echo "::endgroup::"
          echo "::group::Failed tests"
          grep -E "FAILED|AssertionError|expected:" build.log | head -50 || true
          echo "::endgroup::"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glucotrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/
          if-no-files-found: ignore
