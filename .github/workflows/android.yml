name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee -a build.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee -a build.log

      # Gradle buries compiler errors above a long stack trace. Repeating them last means the
      # actual problem is visible at the end of the log rather than hundreds of lines up.
      - name: Compiler errors
        if: failure()
        run: |
          echo "::group::Kotlin and Java errors"
          grep -E "^(e:|error:)" build.log || echo "(no compiler errors — likely a failing test)"
          echo "::endgroup::"
          echo "::group::Failed tests"
          grep -E "FAILED|AssertionError|expected:" build.log | head -50 || true
          echo "::endgroup::"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glucotrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/
          if-no-files-found: ignore

      # A CI artifact is a zip behind a login, which is awkward to install from a phone.
      # A rolling pre-release gives one stable URL that downloads the .apk directly.
      - name: Publish rolling dev build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk glucotrack.apk
          # Written to a file so the notes are not indented into a Markdown code block.
          cat > notes.md <<'NOTES'
          Automatic build. Download **glucotrack.apk** below and open it on the phone.

          Builds are signed with a fixed debug key, so a new one installs over the old
          one and keeps its stored readings.

          Not yet tested against a real sensor. See the README before relying on any
          reading it shows.
          NOTES
          sed -i 's/^          //' notes.md
          echo "" >> notes.md
          echo "Built from commit \`$GITHUB_SHA\`." >> notes.md

          gh release delete dev --yes --cleanup-tag || true
          gh release create dev glucotrack.apk \
            --title "GlucoTrack - latest build" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes-file notes.md
